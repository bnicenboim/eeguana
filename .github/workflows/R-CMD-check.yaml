# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::reticulate
          needs: check
      # Python for the MNE comparison tests. Without this they call
      # skip_if_no_python_stuff() and skip, so the suite stays green but the
      # read_fif / as_eeg_lst / filter-vs-MNE paths go untested.
      #
      # A virtualenv plus RETICULATE_PYTHON is used rather than the conda env
      # that install_py_eeguana() builds locally: pip wheels are much faster in
      # CI, and RETICULATE_PYTHON takes precedence over the
      # use_condaenv("r-eeguana", required = FALSE) hint in .onLoad().
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up r-reticulate venv with mne
        shell: Rscript {0}
        run: |
          library(reticulate)
          virtualenv_create("r-reticulate", Sys.which("python"))
          virtualenv_install("r-reticulate", c("mne", "pandas", "scipy", "numpy"))
          writeLines(
            sprintf("RETICULATE_PYTHON=%s", virtualenv_python("r-reticulate")),
            Sys.getenv("GITHUB_ENV")
          )

      - name: Report what Python the tests will see
        shell: Rscript {0}
        run: |
          library(reticulate)
          print(py_config())
          for (m in c("mne", "pandas", "scipy", "numpy")) {
            cat(m, ":", py_module_available(m), "\n")
          }

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

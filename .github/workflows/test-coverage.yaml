# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::reticulate
          needs: coverage

      # Without Python, every MNE code path (read_fif, as_eeg_lst on an mne
      # raw object, the filter comparisons) counts as uncovered and drags the
      # reported coverage down.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up r-reticulate venv with mne
        shell: Rscript {0}
        run: |
          library(reticulate)
          virtualenv_create("r-reticulate", Sys.which("python"))
          virtualenv_install("r-reticulate", c("mne", "pandas", "scipy", "numpy"))
          writeLines(
            sprintf("RETICULATE_PYTHON=%s", virtualenv_python("r-reticulate")),
            Sys.getenv("GITHUB_ENV")
          )

      - name: Test coverage
        env:
          CODECOV_TOKEN: ${{secrets.codecov_token}}
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "package")
          )
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find ${{ runner.temp }}/package -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
